<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font:
          14px/1.45 system-ui,
          sans-serif;
        width: 300px;
        margin: 0;
        padding: 16px;
        color: #17181c;
      }
      b {
        display: block;
        font-size: 15px;
        margin-bottom: 6px;
      }
      p {
        margin: 0 0 12px;
        color: #4a4d57;
      }
      button {
        font: inherit;
        width: 100%;
        border: 0;
        border-radius: 9px;
        padding: 9px;
        background: #17181c;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #out {
        margin-top: 10px;
        white-space: pre-wrap;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <b>Career OS Autofill</b>
    <p id="status">Checking…</p>
    <button id="fill" disabled>Fill this page</button>
    <div id="out"></div>
    <script src="popup.js"></script>
  </body>
</html>
