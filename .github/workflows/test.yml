name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit, API, dashboard and extension tests, including test/regression.test.mjs,
      # which holds one test per fault found in review.
      - run: npm test
      - run: npm run build
      - run: npx prettier --check public src test extension scripts api
      - name: Check the new employer boards against their published feeds
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { Store } from './src/store.mjs';
          import { catalog } from './src/watchlist.mjs';
          import { discover } from './src/connectors.mjs';
          const store=new Store(fs.mkdtempSync(path.join(os.tmpdir(),'board-check-')));
          const additions=catalog.filter(c=>c.hiringEvidence && c.connector);
          await store.set("companyWatchlist",additions.map(c=>({...c,sourceId:c.id})));
          for(const {id,name,connector} of additions){
            await store.run("INSERT INTO sources(id,company,kind,board) VALUES (?,?,?,?)",id,name,connector.kind,connector.board);
            await discover(store,fetch,{sourceIds:[id],deadline:Date.now()+90000});
            const s=await store.get("SELECT health,error,count FROM sources WHERE id=?",id);
            console.log("Board result",name,JSON.stringify(s));
          }
          for(const j of await store.jobs()) if(!j.closed&&!j.unsuitable)console.log("Board match",JSON.stringify([j.company,j.title,j.assessment.category,j.assessment.region,j.assessment.employmentType]));
          store.close();
          JS
