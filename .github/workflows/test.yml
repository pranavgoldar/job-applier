name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit, API, dashboard and extension tests, including test/regression.test.mjs,
      # which holds one test per fault found in review.
      - run: npm test
      - run: npm run build
      - run: npx prettier --check public src test extension scripts api
